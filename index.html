<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga OCR Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        #container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            border: 1px solid #ccc;
            padding: 10px;
            background: #efefef;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Manga OCR Application</h1>
        <input type="file" id="upload" accept="image/*" />
        <button id="extract">Extract Text</button>
        <div id="output"></div>
    </div>
    <script>
        document.getElementById('extract').onclick = async () => {
            const fileInput = document.getElementById('upload');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please upload an image.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('https://api.example.com/gemini/extractText', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Authorization': 'Bearer YOUR_API_KEY', // Replace with your actual API key
                    },
                });
                const data = await response.json();
                document.getElementById('output').innerText = data.extractedText;
            } catch (error) {
                console.error('Error extracting text:', error);
                alert('There was an error extracting text.');
            }
        };
    </script>
</body>
</html>
