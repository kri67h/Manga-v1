<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga OCR Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Manga OCR Application</h1>
        <input type="file" id="imageInput" accept="image/*" />
        <button id="extractBtn">Extract Text</button>
        <div id="output">
            <h2>Extracted Text:</h2>
            <p id="extractedText"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 20px;
    text-align: center;
}
.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
button {
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: #0056b3;
}
</style>

<script>
const extractBtn = document.getElementById('extractBtn');
const extractedText = document.getElementById('extractedText');

extractBtn.addEventListener('click', async () => {
    const imageInput = document.getElementById('imageInput');
    const file = imageInput.files[0];
    if (!file) {
        alert('Please upload an image file.');
        return;
    }

    // Convert image file to base64
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
        const base64Image = reader.result.split(',')[1];
        try {
            const response = await fetch('https://gemini.googleapis.com/v1/images:analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer YOUR_API_KEY', // Replace YOUR_API_KEY with your actual Google Gemini API key
                },
                body: JSON.stringify({
                    image: {
                        content: base64Image,
                    },
                }),
            });
            const data = await response.json();
            if (data.textAnnotations) {
                extractedText.innerText = data.textAnnotations[0].description;
            } else {
                extractedText.innerText = 'No text extracted.';
            }
        } catch (error) {
            console.error('Error:', error);
            extractedText.innerText = 'Failed to extract text.';
        }
    };
});
</script>
