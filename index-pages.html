<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga OCR Text Extraction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>Manga OCR Text Extraction</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button id="extractTextButton">Extract Text</button>
    <pre id="output"></pre>

    <script>
        document.getElementById('extractTextButton').addEventListener('click', async function() {
            const input = document.getElementById('imageInput');
            const file = input.files[0];
            if (!file) {
                alert('Please upload an image.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('https://api.example.com/manga-ocr', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Authorization': 'Bearer YOUR_API_KEY',
                    },
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                document.getElementById('output').textContent = data.text;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('output').textContent = 'An error occurred: ' + error.message;
            }
        });
    </script>
</body>
</html>
